services:
  db:
    image: postgres:16-alpine
    container_name: cyber-shield-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cyber_shield
    ports:
      - "5433:5432"
    volumes:
      - cyber_shield_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyber_shield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cyber_shield_pg:
